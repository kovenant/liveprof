name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}, doctrine/dbal ${{ matrix.dbal }}, ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        dbal: ['^2.13', '^3.0', '^4.0']
        dependencies: ['highest']
        exclude:
          - php: '8.0'
            dbal: '^4.0'
        include:
          - php: '8.0'
            dbal: '^2.13'
            dependencies: 'lowest'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, pdo_sqlite
          coverage: none

      - name: Select the doctrine/dbal version
        run: composer require --no-update --no-interaction "doctrine/dbal:${{ matrix.dbal }}"

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: composer phpunit

  code-quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: composer cs-view

      - run: composer phpstan
